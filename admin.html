<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ระบบติดตามการส่งงาน | กลุ่มบริหารงานวิชาการ</title>
<meta name="description" content="แผงควบคุม Admin สำหรับจัดการสถานะการส่งงานของครู">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <!-- ============ Login Panel ============ -->
  <div id="loginPanel">
    <div class="login-wrap">
      <div class="brand-mark" style="margin:0 auto 20px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2>เข้าสู่ระบบ Admin</h2>
      <p>ระบบติดตามการส่งงาน · กลุ่มบริหารงานวิชาการ</p>
      <div id="loginError" class="login-error"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">อีเมล</label>
          <input id="email" type="email" placeholder="admin@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="loginBtn">เข้าสู่ระบบ</button>
      </form>
      <a href="index.html" class="back-link">← กลับหน้า Dashboard</a>
    </div>
  </div>

  <!-- ============ Admin Panel ============ -->
  <div id="adminPanel" class="panel-hidden">

    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </div>
        <div>
          <h1>แผงควบคุม Admin</h1>
          <p>กลุ่มบริหารงานวิชาการ · โรงเรียน</p>
        </div>
      </div>
      <div class="nav-links">
        <div class="term-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span id="adminEmail"></span>
        </div>
        <a href="index.html">หน้า Dashboard</a>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">ออกจากระบบ</button>
      </div>
    </div>

    <div class="admin-toolbar">
      <h2>รายการส่งงานทั้งหมด</h2>
      <button id="refreshBtn" class="btn btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
        รีเฟรช
      </button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width:24%">คุณครู</th>
            <th style="width:26%">งานที่ต้องส่ง</th>
            <th style="width:16%">กำหนดส่ง</th>
            <th style="width:18%">สถานะ</th>
            <th style="width:16%"></th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr class="empty-row"><td colspan="5">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>

    <footer>ระบบสำหรับ Admin เท่านั้น · ข้อมูลจะอัปเดตเมื่อกด รีเฟรช</footer>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
